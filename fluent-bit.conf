[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File /fluent-bit/etc/parsers.conf
    http_server  On
    http_listen  0.0.0.0
    http_port    2020
    storage.path /tmp/fluent-bit-buffers
    storage.sync normal

[INPUT]
    Name              tail
    Path              /logs/quarkus-flow-events.log
    Tag               quarkus.flow.events
    Parser            quarkus_flow_json
    Refresh_Interval  1
    Rotate_Wait       30
    Mem_Buf_Limit     256MB
    Buffer_Max_Size   4MB
    storage.type      filesystem
    Read_from_Head    true

[FILTER]
    Name   grep
    Match  quarkus.flow.events
    Regex  eventType ^io\.serverlessworkflow\.

[FILTER]
    Name  rewrite_tag
    Match quarkus.flow.events
    Rule  $eventType ^io\.serverlessworkflow\.workflow\..* dataindex.workflow false
    Emitter_Mem_Buf_Limit 256MB

[FILTER]
    Name  rewrite_tag
    Match quarkus.flow.events
    Rule  $eventType ^io\.serverlessworkflow\.task\..* dataindex.task false
    Emitter_Mem_Buf_Limit 256MB

[OUTPUT]
    Name        pgsql
    Match       dataindex.workflow
    Host        data-index-postgres
    Port        5432
    Database    dataindex
    User        dataindex
    Password    dataindex123
    Table       workflow_events_raw
    Async       Off
    Retry_Limit False

[OUTPUT]
    Name        pgsql
    Match       dataindex.task
    Host        data-index-postgres
    Port        5432
    Database    dataindex
    User        dataindex
    Password    dataindex123
    Table       task_events_raw
    Async       Off
    Retry_Limit False
