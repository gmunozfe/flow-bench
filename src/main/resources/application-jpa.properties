quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/flow
quarkus.datasource.username=flow
quarkus.datasource.password=flow
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

quarkus.log.level=INFO
quarkus.log.min-level=TRACE

quarkus.log.category."io.quarkiverse.flow.persistence.common".level=DEBUG
quarkus.log.category."io.quarkiverse.flow.internal".level=DEBUG


