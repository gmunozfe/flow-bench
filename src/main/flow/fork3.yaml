document:
  dsl: '1.0.0'
  namespace: bench
  name: fork-workflow-3
  version: '1.0.0'

do:
  - initialize:
      set:
        orderId: ${ .orderId }
        amount: ${ .amount }
        customerId: ${ .customerId }
        status: "FORK_STARTED_3"
        subflowsCount: 3

  - runSubflows:
      fork:
        compete: false
        branches:
          - subflow1:
              run:
                workflow:
                  namespace: bench
                  name: simple-subflow-child
                  version: '1.0.0'
                  input:
                    orderId: ${ .orderId }
                    amount: ${ .amount }
                    customerId: ${ .customerId }
          - subflow2:
              run:
                workflow:
                  namespace: bench
                  name: simple-subflow-child
                  version: '1.0.0'
                  input:
                    orderId: ${ .orderId }
                    amount: ${ .amount }
                    customerId: ${ .customerId }
          - subflow3:
              run:
                workflow:
                  namespace: bench
                  name: simple-subflow-child
                  version: '1.0.0'
                  input:
                    orderId: ${ .orderId }
                    amount: ${ .amount }
                    customerId: ${ .customerId }

  - finalize:
      set:
        orderId: ${ [ .[] | .[] | .orderId ][0] }
        amount: ${ [ .[] | .[] | .amount ][0] }
        customerId: ${ [ .[] | .[] | .customerId ][0] }
        status: "COMPLETED_3_SUBFLOWS"
        subflowsCount: 3
