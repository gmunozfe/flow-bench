services:
  redis:
    image: redis:7.2
    container_name: flow-bench-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  valkey:
    image: valkey/valkey:8
    container_name: flow-bench-valkey
    ports:
      - "6380:6379"
    command: ["valkey-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - valkey-data:/data

  postgres:
    image: postgres:17
    container_name: flow-bench-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: flow
      POSTGRES_USER: flow
      POSTGRES_PASSWORD: flow
    volumes:
      - postgres-data:/var/lib/postgresql/data

  infinispan:
    image: quay.io/infinispan/server:latest
    container_name: flow-bench-infinispan
    ports:
      - "11222:11222"
    environment:
      USER: admin
      PASS: password
    volumes:
    - ./infinispan-transactional.xml:/opt/infinispan/server/conf/custom.xml:ro,z
    command: ["-c", "custom.xml"]

  infinispan-1:
    image: quay.io/infinispan-test/server:17346
    container_name: flow-bench-infinispan-1
    hostname: infinispan-1
    ports:
      - "11222:11222"
    environment:
      USER: admin
      PASS: password
      JAVA_OPTIONS: >-
        -Dinfinispan.node.name=infinispan-1
        -Djgroups.dns.query=infinispan
    volumes:
      - ./infinispan-clustered.xml:/opt/infinispan/server/conf/custom.xml:ro,z
    command: ["-c", "custom.xml"]
    networks:
      flow-bench:
        aliases:
          - infinispan
  
  infinispan-2:
    image: quay.io/infinispan-test/server:17346
    container_name: flow-bench-infinispan-2
    hostname: infinispan-2
    ports:
      - "11223:11222"
    environment:
      USER: admin
      PASS: password
      JAVA_OPTIONS: >-
        -Dinfinispan.node.name=infinispan-2
        -Djgroups.dns.query=infinispan
    volumes:
      - ./infinispan-clustered.xml:/opt/infinispan/server/conf/custom.xml:ro,z
    command: ["-c", "custom.xml"]
    networks:
      flow-bench:
        aliases:
          - infinispan

networks:
  flow-bench:
volumes:
  redis-data:
  valkey-data:
  postgres-data:
