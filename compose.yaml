services:
  redis:
    image: redis:7.2
    container_name: flow-bench-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  valkey:
    image: valkey/valkey:8
    container_name: flow-bench-valkey
    ports:
      - "6380:6379"
    command: ["valkey-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - valkey-data:/data

  postgres:
    image: postgres:17
    container_name: flow-bench-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: flow
      POSTGRES_USER: flow
      POSTGRES_PASSWORD: flow
    volumes:
      - postgres-data:/var/lib/postgresql/data

  infinispan:
    image: quay.io/infinispan/server:latest
    container_name: flow-bench-infinispan
    ports:
      - "11222:11222"
    environment:
      USER: admin
      PASS: password
    volumes:
    - ./infinispan-transactional.xml:/opt/infinispan/server/conf/custom.xml:ro,z
    command: ["-c", "custom.xml"]

  fluentbit-pg:
    image: fluent/fluent-bit:latest
    container_name: flow-bench-fluentbit
    profiles: ["postgres"]
    depends_on:
      data-index-postgres:
        condition: service_healthy
    volumes:
      - ./target:/logs:ro,z
      - ./fluent-bit/fluent-bit-postgres.conf:/fluent-bit/etc/fluent-bit.conf:ro,z
      - ./fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro,z
      - fluentbit-storage:/tmp/fluent-bit-buffers
    ports:
      - "2020:2020"
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/fluent-bit.conf"]

  fluentbit-es:
    image: fluent/fluent-bit:latest
    container_name: flow-bench-fluentbit
    profiles: ["elasticsearch"]
    depends_on:
      data-index-elasticsearch:
        condition: service_healthy
    volumes:
      - ./target:/logs:ro,z
      - ./fluent-bit/fluent-bit-elasticsearch.conf:/fluent-bit/etc/fluent-bit.conf:ro,z
      - ./fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro,z
      - fluentbit-storage:/tmp/fluent-bit-buffers
    ports:
      - "2020:2020"
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/fluent-bit.conf"]

  infinispan-1:
    image: quay.io/infinispan-test/server:17346
    container_name: flow-bench-infinispan-1
    hostname: infinispan-1
    ports:
      - "11222:11222"
    environment:
      USER: admin
      PASS: password
      JAVA_OPTIONS: >-
        -Dinfinispan.node.name=infinispan-1
        -Djgroups.dns.query=infinispan
    volumes:
      - ./infinispan-clustered.xml:/opt/infinispan/server/conf/custom.xml:ro,z
    command: ["-c", "custom.xml"]
    networks:
      flow-bench:
        aliases:
          - infinispan
  
  infinispan-2:
    image: quay.io/infinispan-test/server:17346
    container_name: flow-bench-infinispan-2
    hostname: infinispan-2
    ports:
      - "11223:11222"
    environment:
      USER: admin
      PASS: password
      JAVA_OPTIONS: >-
        -Dinfinispan.node.name=infinispan-2
        -Djgroups.dns.query=infinispan
    volumes:
      - ./infinispan-clustered.xml:/opt/infinispan/server/conf/custom.xml:ro,z
    command: ["-c", "custom.xml"]
    networks:
      flow-bench:
        aliases:
          - infinispan

  data-index-postgres:
    image: postgres:17
    container_name: flow-bench-data-index-postgres
    profiles: ["postgres"]
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: dataindex
      POSTGRES_USER: dataindex
      POSTGRES_PASSWORD: dataindex123
    volumes:
      - data-index-postgres-data:/var/lib/postgresql/data
      - /home/gmunozfe/git/logic-apps/data-index/data-index-storage/data-index-storage-migrations/src/main/resources/db/migration/V1__initial_schema.sql:/docker-entrypoint-initdb.d/01-data-index.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataindex -d dataindex"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
  
  data-index-service-pg:
    image: kubesmarts/data-index-service-postgresql:999-SNAPSHOT
    container_name: flow-bench-data-index-service-pg
    profiles: ["postgres"]
    depends_on:
      data-index-postgres:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://data-index-postgres:5432/dataindex
      QUARKUS_DATASOURCE_USERNAME: dataindex
      QUARKUS_DATASOURCE_PASSWORD: dataindex123

  data-index-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: flow-bench-data-index-elasticsearch
    profiles: ["elasticsearch"]
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms2g -Xmx2g"
    volumes:
      - data-index-elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -E 'green|yellow'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  data-index-service-es:
    image: kubesmarts/data-index-service-elasticsearch:999-SNAPSHOT
    container_name: flow-bench-data-index-service-es
    profiles: ["elasticsearch"]
    depends_on:
      data-index-elasticsearch:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      QUARKUS_ELASTICSEARCH_HOSTS: data-index-elasticsearch:9200
      DATA_INDEX_STORAGE_SKIP_INIT_SCHEMA: "false"
      DATA_INDEX_ELASTICSEARCH_SCHEMA_INIT_ENABLED: "true"

networks:
  flow-bench:
volumes:
  redis-data:
  valkey-data:
  postgres-data:
  fluentbit-storage:
  data-index-postgres-data:
  data-index-elasticsearch-data:
